name: Windows 11 server

on:
  workflow_dispatch:
    inputs:
      duration:
        description: '🕐 Usage Duration'
        required: false
        default: '5h40m'
        type: choice
        options:
        - '1h'
        - '3h' 
        - '5h40m'

jobs:
  Premium-RDP-Setup:
    runs-on: windows-latest
    timeout-minutes: 340
    
    steps:
      # WELCOME BANNER
      - name: 🎯 SYSTEM STARTUP
        run: |
          Write-Host ""
          Write-Host "🕒 Duration: ${{ github.event.inputs.duration }}" -ForegroundColor Magenta
          Write-Host "👤 User Identity: snakext" -ForegroundColor Cyan
          Write-Host ""
          $frames = @('⣾', '⣽', '⣻', '⢿', '⡿', '⣟', '⣯', '⣷')
          for($i=0; $i -lt 10; $i++) {
              Write-Host "`r🚀 Initializing snakext system... $($frames[$i % 8])" -NoNewline -ForegroundColor Blue
              Start-Sleep -Milliseconds 100
          }
          Write-Host "`r✅ System is ready!                        " -ForegroundColor Green

      # ADVANCED CONFIGURATION
      - name: 🔧 SYSTEM CONFIGURATION
        run: |
          Write-Host "🛠️  CONFIGURING SYSTEM" -ForegroundColor Yellow
          $steps = @(
              @{Name="Enabling Remote Desktop"; Script={ 
                  Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
              }},
              @{Name="Disabling Network Authentication"; Script={
                  Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
              }},
              @{Name="Configuring RDP Security"; Script={
                  Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
              }},
              @{Name="Opening Firewall Port 3389"; Script={
                  netsh advfirewall firewall add rule name="RDP-Premium" dir=in action=allow protocol=TCP localport=3389 profile=any
                  netsh advfirewall firewall add rule name="RDP-Premium-Out" dir=out action=allow protocol=TCP localport=3389 profile=any
              }},
              @{Name="Starting Services"; Script={
                  Set-Service -Name TermService -StartupType Automatic -ErrorAction SilentlyContinue
                  Start-Service -Name TermService -ErrorAction SilentlyContinue
              }}
          )
          foreach($step in $steps) {
              try { & $step.Script; Write-Host "│ ✅ $($step.Name)" -ForegroundColor Green } catch { Write-Host "│ ⚠️  $($step.Name) - Error" }
          }

      # CREATE USER snakext
      - name: 👤 CREATE PREMIUM ACCOUNT
        run: |
          $newUsername = "snakext"
          Write-Host "👤 CREATING ACCOUNT: $newUsername" -ForegroundColor Yellow
          
          function New-PremiumPassword {
              $upper = 'ABCDEFGHJKLMNPQRSTUVWXYZ'; $lower = 'abcdefghijkmnpqrstuvwxyz'; $numbers = '23456789'
              $all = $upper + $lower + $numbers
              $pw = $upper[(Get-Random -Max $upper.Length)] + $lower[(Get-Random -Max $lower.Length)] + $numbers[(Get-Random -Max $numbers.Length)]
              for ($i = 1; $i -le 5; $i++) { $pw += $all[(Get-Random -Max $all.Length)] }
              return -join ($pw.ToCharArray() | Sort-Object { Get-Random })
          }

          $password = if ($env:CUSTOM_RDP_PASS) { $env:CUSTOM_RDP_PASS } else { New-PremiumPassword }
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          
          # Remove if exists and create
          Remove-LocalUser -Name $newUsername -ErrorAction SilentlyContinue
          New-LocalUser -Name $newUsername -Password $securePass -AccountNeverExpires -Description "snakext Premium Account"
          
          # Permissions
          Add-LocalGroupMember -Group "Administrators" -Member $newUsername -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $newUsername -ErrorAction SilentlyContinue
          Enable-LocalUser -Name $newUsername
          
          echo "RDP_USER=$newUsername" >> $env:GITHUB_ENV
          echo "RDP_PASS=$password" >> $env:GITHUB_ENV
          echo "$password" > $env:TEMP\rdp_password.txt
          Write-Host "✅ Account: $newUsername is ready" -ForegroundColor Green

      # CHECK LOGIN PERMISSIONS
      - name: 🔍 CHECK SYSTEM PERMISSIONS
        run: |
          $user = Get-LocalUser -Name "snakext" -ErrorAction SilentlyContinue
          if ($user) { Write-Host "│ ✅ User snakext exists" -ForegroundColor Green }
          else { Write-Host "│ ❌ User creation failed" -ForegroundColor Red; exit 1 }
          
          $isAdmin = (Get-LocalGroupMember -Group "Administrators" | Where-Object {$_.Name -like "*snakext"}).Count -gt 0
          if ($isAdmin) { Write-Host "│ ✅ Admin rights confirmed" -ForegroundColor Green }

      # TAILSCALE SETUP
      - name: 🌐 SETUP PREMIUM NETWORK
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $msiPath = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile $msiPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$msiPath`"", "/quiet", "/norestart" -Wait
          Start-Sleep -Seconds 10
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=$env:TAILSCALE_AUTH_KEY --hostname=snakext-host-$env:GITHUB_RUN_ID --accept-routes --accept-dns --reset
          
          $ip = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
          echo "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV

      # DISPLAY CONNECTION INFO
      - name: 🎉 CONNECTION INFORMATION
        run: |
          $password = Get-Content $env:TEMP\rdp_password.txt
          $totalMinutes = switch ("${{ github.event.inputs.duration }}") { "1h" { 60 } "3h" { 180 } "5h40m" { 340 } }
          
          Write-Host "┌───────────────────────────────────────────┐" -ForegroundColor Cyan
          Write-Host "│          🎉 CONNECTION SUCCESS!           │" -ForegroundColor Cyan
          Write-Host "├───────────────────────────────────────────┤" -ForegroundColor Cyan
          Write-Host "│ 🌐 Address: $env:TAILSCALE_IP"
          Write-Host "│ 👤 Account: snakext" -ForegroundColor Yellow
          Write-Host "│ 🔐 Password: $password" -ForegroundColor White
          Write-Host "│ 📍 Port: 3389"
          Write-Host "└───────────────────────────────────────────┘" -ForegroundColor Cyan
          echo "TOTAL_MINUTES=$totalMinutes" >> $env:GITHUB_ENV

      # MAINTAIN SESSION
      - name: ⏳ MAINTAIN SESSION
        run: |
          $totalMinutes = $env:TOTAL_MINUTES
          $endTimeLog = (Get-Date).AddMinutes($totalMinutes)
          
          Write-Host "🔄 Session snakext active..." -ForegroundColor Green
          do {
              $timeLeft = $endTimeLog - (Get-Date)
              $h = [math]::Max(0, [math]::Floor($timeLeft.TotalHours))
              $m = [math]::Max(0, [math]::Floor($timeLeft.TotalMinutes % 60))
              Write-Host "`r⏳ Remaining for snakext: $h h $m m" -NoNewline -ForegroundColor Cyan
              Start-Sleep -Seconds 10
          } while ($timeLeft.TotalSeconds -gt 0)

      # CLEANUP
      - name: 🧹 SYSTEM CLEANUP
        if: always()
        run: |
          Write-Host "🧹 Cleaning up snakext session..." -ForegroundColor Yellow
          Disable-LocalUser -Name "snakext" -ErrorAction SilentlyContinue
          & "$env:ProgramFiles\Tailscale\tailscale.exe" down --accept-risk=all -ErrorAction SilentlyContinue
